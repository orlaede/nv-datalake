x-nvdatalake-env: &nvdatalake-env
  # Source db "nvtr" (schema ce_eusebio) — prefix is SOURCE_<DBNAME>_<SCHEMA>_, derived
  # automatically in sources_config.py from each SourceConfig's dbname/schema.
  # Values come from .env (see .env.example) — never hardcode credentials here.
  SOURCE_NVTR_CE_EUSEBIO_DB_HOST: ${SOURCE_NVTR_CE_EUSEBIO_DB_HOST}
  SOURCE_NVTR_CE_EUSEBIO_DB_PORT: ${SOURCE_NVTR_CE_EUSEBIO_DB_PORT}
  SOURCE_NVTR_CE_EUSEBIO_DB_USER: ${SOURCE_NVTR_CE_EUSEBIO_DB_USER}
  SOURCE_NVTR_CE_EUSEBIO_DB_PASSWORD: ${SOURCE_NVTR_CE_EUSEBIO_DB_PASSWORD}
  SOURCE_NVTR_CE_EUSEBIO_DB_NAME: ${SOURCE_NVTR_CE_EUSEBIO_DB_NAME}

  # Source db "nvtr" (schema ce_aquiraz) — same physical db, different schema/prefix
  SOURCE_NVTR_CE_AQUIRAZ_DB_HOST: ${SOURCE_NVTR_CE_AQUIRAZ_DB_HOST}
  SOURCE_NVTR_CE_AQUIRAZ_DB_PORT: ${SOURCE_NVTR_CE_AQUIRAZ_DB_PORT}
  SOURCE_NVTR_CE_AQUIRAZ_DB_USER: ${SOURCE_NVTR_CE_AQUIRAZ_DB_USER}
  SOURCE_NVTR_CE_AQUIRAZ_DB_PASSWORD: ${SOURCE_NVTR_CE_AQUIRAZ_DB_PASSWORD}
  SOURCE_NVTR_CE_AQUIRAZ_DB_NAME: ${SOURCE_NVTR_CE_AQUIRAZ_DB_NAME}

  # Destination db (nvdatalake) — used by both the Dagster loader and dbt
  DATALAKE_DB_HOST: ${DATALAKE_DB_HOST}
  DATALAKE_DB_PORT: ${DATALAKE_DB_PORT}
  DATALAKE_DB_USER: ${DATALAKE_DB_USER}
  DATALAKE_DB_PASSWORD: ${DATALAKE_DB_PASSWORD}
  DATALAKE_DB_NAME: ${DATALAKE_DB_NAME}

services:
  nvdatalake:
    build: .
    image: nvdatalake:latest
    ports:
      - "3000:3000"
    environment:
      <<: *nvdatalake-env
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - dagster_home:/app/dagster_home

  nvdatalake-daemon:
    image: nvdatalake:latest
    depends_on:
      - nvdatalake
    command: ["uv", "run", "dagster-daemon", "run"]
    environment:
      <<: *nvdatalake-env
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - dagster_home:/app/dagster_home

volumes:
  dagster_home:
