x-nvdatalake-env: &nvdatalake-env
  # Source db "nvtr" (schema ce_eusebio) — prefix is SOURCE_<DBNAME>_<SCHEMA>_, derived
  # automatically in sources_config.py from each SourceConfig's dbname/schema
  SOURCE_NVTR_CE_EUSEBIO_DB_HOST: host.docker.internal
  SOURCE_NVTR_CE_EUSEBIO_DB_PORT: "5432"
  SOURCE_NVTR_CE_EUSEBIO_DB_USER: postgres
  SOURCE_NVTR_CE_EUSEBIO_DB_PASSWORD: postgres
  SOURCE_NVTR_CE_EUSEBIO_DB_NAME: nvtr

  # Source db "nvtr" (schema ce_aquiraz) — same physical db, different schema/prefix
  SOURCE_NVTR_CE_AQUIRAZ_DB_HOST: host.docker.internal
  SOURCE_NVTR_CE_AQUIRAZ_DB_PORT: "5432"
  SOURCE_NVTR_CE_AQUIRAZ_DB_USER: postgres
  SOURCE_NVTR_CE_AQUIRAZ_DB_PASSWORD: postgres
  SOURCE_NVTR_CE_AQUIRAZ_DB_NAME: nvtr

  # Destination db (nvdatalake) — used by both the Dagster loader and dbt
  DATALAKE_DB_HOST: host.docker.internal
  DATALAKE_DB_PORT: "5432"
  DATALAKE_DB_USER: postgres
  DATALAKE_DB_PASSWORD: postgres
  DATALAKE_DB_NAME: nvdatalake

services:
  nvdatalake:
    build: .
    image: nvdatalake:latest
    ports:
      - "3000:3000"
    environment:
      <<: *nvdatalake-env
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - dagster_home:/app/dagster_home

  nvdatalake-daemon:
    image: nvdatalake:latest
    depends_on:
      - nvdatalake
    command: ["uv", "run", "dagster-daemon", "run"]
    environment:
      <<: *nvdatalake-env
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - dagster_home:/app/dagster_home

volumes:
  dagster_home:
