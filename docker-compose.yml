x-nvdatalake-env: &nvdatalake-env
  # Source db "nvtr" — prefix is SOURCE_<DBNAME>_, derived automatically in
  # sources_config.py from each SourceConfig's dbname. Shared by every
  # SourceConfig with dbname="nvtr" regardless of schema (ce_caucaia_amostra,
  # ce_quixada, ...) since they're the same physical database.
  # Values come from .env (see .env.example) — never hardcode credentials here.
  SOURCE_NVTR_DB_HOST: ${SOURCE_NVTR_DB_HOST}
  SOURCE_NVTR_DB_PORT: ${SOURCE_NVTR_DB_PORT}
  SOURCE_NVTR_DB_USER: ${SOURCE_NVTR_DB_USER}
  SOURCE_NVTR_DB_PASSWORD: ${SOURCE_NVTR_DB_PASSWORD}
  SOURCE_NVTR_DB_NAME: ${SOURCE_NVTR_DB_NAME}

  # Destination db (nvdatalake) — used by the Kestra loader and dbt
  DATALAKE_DB_HOST: ${DATALAKE_DB_HOST}
  DATALAKE_DB_PORT: ${DATALAKE_DB_PORT}
  DATALAKE_DB_USER: ${DATALAKE_DB_USER}
  DATALAKE_DB_PASSWORD: ${DATALAKE_DB_PASSWORD}
  DATALAKE_DB_NAME: ${DATALAKE_DB_NAME}

services:
  kestra-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:-kestra-local}
    volumes:
      - kestra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 5s
      timeout: 5s
      retries: 20

  kestra:
    build:
      context: .
      dockerfile: kestra/Dockerfile
    image: nvdatalake-kestra:local
    restart: unless-stopped
    command: ["server", "standalone"]
    ports:
      - "127.0.0.1:${KESTRA_PORT:-8082}:8080"
    depends_on:
      kestra-postgres:
        condition: service_healthy
    environment:
      <<: *nvdatalake-env
      PGSSLMODE: ${PGSSLMODE:-require}
      KESTRA_DB_PASSWORD: ${KESTRA_DB_PASSWORD:-kestra-local}
      KESTRA_API_USER: ${KESTRA_API_USER:-admin@nvdatalake.local}
      KESTRA_API_PASSWORD: ${KESTRA_API_PASSWORD:-KestraLocal123!}
      JAVA_OPTS: ${KESTRA_JAVA_OPTS:--Xms256m -Xmx1g}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: $${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: $${KESTRA_API_USER}
              password: $${KESTRA_API_PASSWORD}
          tutorialFlows:
            enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:${KESTRA_PORT:-8082}/
    volumes:
      - kestra_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kestra-import:
    image: nvdatalake-kestra:local
    depends_on:
      kestra:
        condition: service_healthy
    entrypoint: ["python", "/opt/nvdatalake/scripts/kestra.py"]
    command: ["import", "--url", "http://kestra:8080", "--flow", "/opt/kestra/flows/materialize_all.yml"]
    environment:
      KESTRA_API_USER: ${KESTRA_API_USER:-admin@nvdatalake.local}
      KESTRA_API_PASSWORD: ${KESTRA_API_PASSWORD:-KestraLocal123!}

  api:
    build: ./apps/api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATALAKE_DB_HOST: ${DATALAKE_DB_HOST}
      DATALAKE_DB_PORT: ${DATALAKE_DB_PORT}
      DATALAKE_DB_USER: ${DATALAKE_DB_USER}
      DATALAKE_DB_PASSWORD: ${DATALAKE_DB_PASSWORD}
      DATALAKE_DB_NAME: ${DATALAKE_DB_NAME}
      PGSSLMODE: ${PGSSLMODE:-require}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env (at least 32 characters)}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-nv-datalake-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-nv-datalake-web}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-nv_refresh}
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGIN: ${AUTH_ALLOWED_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kestra_postgres:
  kestra_storage:
