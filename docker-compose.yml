x-nvdatalake-env: &nvdatalake-env
  # Source db "nvtr" — prefix is SOURCE_<DBNAME>_, derived automatically in
  # sources_config.py from each SourceConfig's dbname. Shared by every
  # SourceConfig with dbname="nvtr" regardless of schema (ce_caucaia_amostra,
  # ce_quixada, ...) since they're the same physical database.
  # Values come from .env (see .env.example) — never hardcode credentials here.
  SOURCE_NVTR_DB_HOST: ${SOURCE_NVTR_DB_HOST}
  SOURCE_NVTR_DB_PORT: ${SOURCE_NVTR_DB_PORT}
  SOURCE_NVTR_DB_USER: ${SOURCE_NVTR_DB_USER}
  SOURCE_NVTR_DB_PASSWORD: ${SOURCE_NVTR_DB_PASSWORD}
  SOURCE_NVTR_DB_NAME: ${SOURCE_NVTR_DB_NAME}

  # Destination db (nvdatalake) — used by both the Dagster loader and dbt
  DATALAKE_DB_HOST: ${DATALAKE_DB_HOST}
  DATALAKE_DB_PORT: ${DATALAKE_DB_PORT}
  DATALAKE_DB_USER: ${DATALAKE_DB_USER}
  DATALAKE_DB_PASSWORD: ${DATALAKE_DB_PASSWORD}
  DATALAKE_DB_NAME: ${DATALAKE_DB_NAME}

services:
  api:
    build: ./apps/api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATALAKE_DB_HOST: ${DATALAKE_DB_HOST}
      DATALAKE_DB_PORT: ${DATALAKE_DB_PORT}
      DATALAKE_DB_USER: ${DATALAKE_DB_USER}
      DATALAKE_DB_PASSWORD: ${DATALAKE_DB_PASSWORD}
      DATALAKE_DB_NAME: ${DATALAKE_DB_NAME}
      PGSSLMODE: ${PGSSLMODE:-require}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env (at least 32 characters)}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-nv-datalake-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-nv-datalake-web}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-nv_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ALLOWED_ORIGIN: ${AUTH_ALLOWED_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  nvdatalake:
    build: .
    image: nvdatalake:latest
    environment:
      <<: *nvdatalake-env
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - dagster_home:/app/dagster_home

  nvdatalake-daemon:
    image: nvdatalake:latest
    depends_on:
      - nvdatalake
    command: ["uv", "run", "dagster-daemon", "run"]
    environment:
      <<: *nvdatalake-env
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - dagster_home:/app/dagster_home

  # Gateway TLS. Único serviço com porta publicada: web em HTTPS, Dagster em HTTPS
  # com basic-auth. Api, web e nvdatalake ficam apenas na rede interna do Compose.
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${TLS_PORT:-8443}:${TLS_PORT:-8443}"
      - "${DAGSTER_TLS_PORT:-8444}:${DAGSTER_TLS_PORT:-8444}"
    environment:
      TLS_PORT: ${TLS_PORT:-8443}
      DAGSTER_TLS_PORT: ${DAGSTER_TLS_PORT:-8444}
    volumes:
      - ./apps/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      # gitignored; ver apps/gateway/auth.caddy.example
      - ./apps/gateway/auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy_data:/data

volumes:
  dagster_home:
  caddy_data:
