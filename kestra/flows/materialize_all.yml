id: materialize_all
namespace: nvdatalake
description: Todas as origens Bronze e todo o projeto dbt Bronze/Silver/Gold.

inputs:
  - id: full_refresh
    type: BOOL
    defaults: false

concurrency:
  limit: 1
  behavior: QUEUE

# Origens de dados. `schemas` são os schemas do banco `dbname`; todos têm as
# mesmas `tables`. A conexão vem de SOURCE_<DBNAME>_DB_* (ou
# SOURCE_<DBNAME>_DB_URL). A tabela Bronze se chama <dbname>_<schema>__<tabela>.
# Para adicionar um schema, basta acrescentá-lo em `schemas` (pluginDefaults
# repassa estas variáveis à ingestão e ao dbt; a macro bronze_union monta os
# modelos de staging). Inclua o nome de exibição em silver/dim_origem.sql.
variables:
  dbname: nvtr
  schemas:
    - ce_caucaia_amostra
    - sc_pomerode
    - sc_bcamboriu
    - sc_brusquet
    - sc_criciumat
    - pr_curitiba
  tables:
    - auto_infracao
    - agente
    - infracao
    - municipio
    - pessoa
    - veiculo
    - erro_consistencia
  # Tabelas que podem não existir em todos os schemas. Se ausente, a ingestão
  # e o dbt apenas registram um aviso (WARNING) e seguem sem erro.
  optional_tables:
    - ait_retorno
    - codigo_retorno

pluginDefaults:
  - type: io.kestra.plugin.scripts.shell.Commands
    values:
      env:
        NVDATALAKE_DBNAME: "{{ vars.dbname }}"
        NVDATALAKE_SCHEMAS: "{{ vars.schemas | json }}"
        NVDATALAKE_TABLES: "{{ vars.tables | json }}"
        NVDATALAKE_OPTIONAL_TABLES: "{{ vars.optional_tables | json }}"
  - type: io.kestra.plugin.dbt.cli.DbtCLI
    values:
      env:
        NVDATALAKE_DBNAME: "{{ vars.dbname }}"
        NVDATALAKE_SCHEMAS: "{{ vars.schemas | json }}"
        NVDATALAKE_TABLES: "{{ vars.tables | json }}"
        NVDATALAKE_OPTIONAL_TABLES: "{{ vars.optional_tables | json }}"

tasks:
  - id: pipeline
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: ingest_bronze
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - python /opt/nvdatalake/kestra/ingest.py
        outputFiles:
          - ingestion.json
          - skipped.json

      - id: prepare_dbt
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - cp -R /opt/nvdatalake/dbt/nvdatalake ./nvdatalake
          - dbt deps --project-dir nvdatalake --profiles-dir nvdatalake
          - dbt debug --project-dir nvdatalake --profiles-dir nvdatalake

      - id: build_dbt
        type: io.kestra.plugin.dbt.cli.DbtCLI
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        projectDir: nvdatalake
        commands:
          - "dbt build --project-dir nvdatalake --profiles-dir nvdatalake {{ inputs.full_refresh ? '--full-refresh' : '' }}"
        outputFiles:
          - nvdatalake/target/manifest.json
          - nvdatalake/target/run_results.json

      - id: docs_dbt
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - dbt docs generate --project-dir nvdatalake --profiles-dir nvdatalake
        outputFiles:
          - nvdatalake/target/catalog.json
          - nvdatalake/target/index.html

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"
    timezone: America/Sao_Paulo
    disabled: true
