services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: kestra
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kestra"]
      interval: 2s
      timeout: 3s
      retries: 30

  kestra:
    image: nvdatalake-kestra:local
    build:
      context: ../..
      dockerfile: kestra/Dockerfile
    command: ["server", "standalone"]
    volumes:
      - kestra_storage:/app/storage
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1g -XX:UseSVE=0"
      SOURCE_NVTR_DB_HOST: postgres
      SOURCE_NVTR_DB_PORT: 5432
      SOURCE_NVTR_DB_USER: postgres
      SOURCE_NVTR_DB_PASSWORD: fixture
      SOURCE_NVTR_DB_NAME: nvtr
      DATALAKE_DB_HOST: postgres
      DATALAKE_DB_PORT: 5432
      DATALAKE_DB_USER: postgres
      DATALAKE_DB_PASSWORD: fixture
      DATALAKE_DB_NAME: nvdatalake
      PGSSLMODE: disable
      KESTRA_DB_PASSWORD: fixture
      KESTRA_API_USER: admin@kestra.local
      KESTRA_API_PASSWORD: Fixture123!
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: postgres
            password: $${KESTRA_DB_PASSWORD}
        kestra:
          tutorialFlows:
            enabled: false
          server:
            basic-auth:
              username: $${KESTRA_API_USER}
              password: $${KESTRA_API_PASSWORD}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:18082/
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  kestra-import:
    image: nvdatalake-kestra:local
    depends_on:
      kestra:
        condition: service_healthy
    entrypoint: ["python", "/opt/nvdatalake/scripts/kestra.py"]
    command: ["import", "--url", "http://kestra:8080", "--flow", "/opt/kestra/flows/materialize_all.yml"]
    environment:
      KESTRA_API_USER: admin@kestra.local
      KESTRA_API_PASSWORD: Fixture123!

volumes:
  postgres_data:
  kestra_storage:
